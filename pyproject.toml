[project]
name = "serverest-robot-automation"
version = "1.0.0"
description = "Robot Framework API tests for ServeRest"
requires-python = ">=3.13"

[tool.robocop.lint]
configure = [
    "line-too-long.line_length=120",
    "too-many-calls-in-test-case.max_calls=20",
    "too-many-calls-in-keyword.max_calls=15",
    "too-many-arguments.max_args=7",           # Send Request is the single HTTP entry point
]
ignore = [
    "missing-doc-test-case",    # test name + test-plan ID are the documentation
    "inconsistent-assignment",  # VAR has no assignment sign by design
    "could-be-test-tags",       # tags stay on each test so the tag policy is visible
]

[tool.robocop.format]
space_count = 4
