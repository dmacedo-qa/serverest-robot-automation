# Local development: ServeRest from `docker compose up -d` or `npx serverest@3.2.2 --nodoc`.
base_url: http://localhost:3000
short_token_base_url: http://localhost:3001   # only for AUTH-04 (docker compose --profile expiry)

# HTTP
request_timeout: 10          # seconds per request
verify_ssl: false            # local HTTP only

# Auth
token_ttl: 600               # must match the ServeRest --timeout (default 600)
short_token_ttl: 5           # must match the short-token instance in docker-compose.yml
token_refresh_margin: 60     # refresh cached tokens this many seconds before expiry

# Test data
data_locale: pt_BR
cleanup_enabled: true        # set to false to inspect leftover data after a failure
