# Local development: ServeRest from `docker compose up -d`.
base_url: http://localhost:3000
short_token_base_url: http://localhost:3001   # instance with 5 s tokens, used by TOK-06

request_timeout: 10          # seconds per request
verify_ssl: false
data_locale: pt_BR
cleanup_enabled: true        # false keeps test data after the run, for debugging
