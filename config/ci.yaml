# GitHub Actions: ServeRest runs as a Docker service next to the runner.
base_url: http://localhost:3000
short_token_base_url: http://localhost:3001

# HTTP. Shared CI runners are slower, so allow more time per request.
request_timeout: 20
verify_ssl: false

# Auth
token_ttl: 600
short_token_ttl: 5
token_refresh_margin: 60

# Test data
data_locale: pt_BR
cleanup_enabled: true
