# CI and the Docker test runner (URLs are overridden by docker-compose.yml).
base_url: http://localhost:3000
short_token_base_url: http://localhost:3001   # instance with 5 s tokens, used by TOK-06

request_timeout: 20          # seconds per request
verify_ssl: false
data_locale: pt_BR
cleanup_enabled: true        # false keeps test data after the run, for debugging
